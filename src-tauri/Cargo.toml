[package]
name = "content-to-md"
version = "1.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
sha2 = "0.10"
clipboard-win = "5.4"
gray_matter = "0.3.2"
keyring = { version = "3.6.3", features = ["windows-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-window-state = "2"
trash = "5"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
